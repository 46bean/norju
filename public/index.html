<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>구습몬 𖠌</title>
<meta name="description" content="구문습득하는몬스터" />
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<header class="topbar">
  <h1 class="logo">구문습득하는몬스터</h1>
  <div class="user">
    <span id="who" class="chip"></span>
    <button id="btn-toggle" class="btn">전체보기</button>
    <button id="btn-write" class="btn primary">글쓰기</button>
    <button id="btn-nick" class="btn ghost">닉네임 변경</button>
  </div>
</header>

<main>
  <!-- 홈: 흩뿌려진 인덱스 -->
  <section id="view-scatter">
    <p class="tagline">글자를 누르면 단어가 무작위로 나옵니다.<span id="total" class="total"></span></p>
    <div id="scatter" class="scatter"></div>
  </section>

  <!-- 전체보기 -->
  <section id="view-list" hidden>
    <div class="list-head">
      <h2>전체보기</h2>
      <button id="btn-home" class="btn ghost">홈으로</button>
    </div>
    <nav id="index-grid" class="index-grid" aria-label="인덱스"></nav>
    <h3 id="list-title" class="list-title">인덱스를 선택하세요</h3>
    <div id="word-list" class="word-list"></div>
  </section>
</main>

<!-- 닉네임 -->
<dialog id="dlg-nick">
  <form method="dialog" id="form-nick">
    <h3>닉네임 설정</h3>
    <p class="sub">이 닉네임이 아이디 역할을 합니다.</p>
    <input id="nick-input" maxlength="20" placeholder="오드존예" required autocomplete="off" />
    <div class="row-end"><button class="btn primary" value="ok">시작하기</button></div>
  </form>
</dialog>

<!-- 단어 보기 -->
<dialog id="dlg-view">
  <div class="v-top">
    <span id="v-letter" class="v-letter"></span>
    <span id="v-count" class="v-count"></span>
    <button id="v-close" class="x-btn" aria-label="닫기">&times;</button>
  </div>

  <p id="v-empty" class="v-empty" hidden>
    아직 연결된 단어가 없어요.<br />
    <button id="v-empty-write" class="btn primary">첫 단어 쓰기</button>
  </p>

  <div id="v-main">
    <h3 id="v-word" class="v-word"></h3>
    <button id="v-reveal" class="btn reveal">뜻 보기</button>
    <div id="v-body" class="v-body" hidden>
      <p id="v-meaning" class="v-meaning"></p>
      <p id="v-example" class="v-example"></p>
    </div>
    <footer class="v-foot">
      <span id="v-author" class="v-author"></span>
      <span class="v-right">
        <span id="v-tools" class="v-tools"></span>
        <button id="v-next" class="btn">다른 단어</button>
      </span>
    </footer>
  </div>
</dialog>

<!-- 작성 / 수정 -->
<dialog id="dlg-card">
  <form id="form-card">
    <h3 id="card-form-title">카드 작성</h3>
    <input type="hidden" id="card-id" />
    <label>단어 <input id="f-word" maxlength="60" required autocomplete="off" /></label>
    <label>뜻 <textarea id="f-meaning" maxlength="500" rows="3" required></textarea></label>
    <label>예문 (선택) <textarea id="f-example" maxlength="500" rows="3"></textarea></label>
    <p id="form-error" class="err"></p>
    <div class="row-end">
      <button type="button" class="btn ghost" id="card-cancel">취소</button>
      <button type="submit" class="btn primary">저장</button>
    </div>
  </form>
</dialog>

<script src="/app.js"></script>
</body>
</html>
